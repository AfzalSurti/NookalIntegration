{% extends "base.html" %}
{% block title %}Sign in — Back to Ease{% endblock %}
{% block body %}
<div class="login-layout">
  <div class="login-card">
    <div class="login-brand">
      <h1>Back to Ease</h1>
      <p>Physiotherapy clinic operations</p>
    </div>
    {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-input" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; height:38px; font-size:0.9rem;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}

# Non-secret runtime config. Secrets live in config/.env (never committed).

paths:
  # Override via env AUTOMATION_HOME when deploying to the clinic Mac.
  # Local default: repo-relative.
  audit_dir: logs/audit
  app_log_dir: logs/app
  kill_switch_file: config/KILL_SWITCH
  working_dir: data/working
  sent_log_dir: data/working/sent

nookal:
  base_url: https://api.nookal.com/production/v2/
  # Leave null until docs confirm the real limit; client will use a conservative default.
  requests_per_second: 2
  max_retries: 4
  timeout_seconds: 30

llm:
  base_url: http://127.0.0.1:11434
  model: qwen3.5:9b
  temperature: 0.2
  # Benchmark (2026-09-09): Measured eval rate 20.81 tok/s on Mac (M1 Pro, 16GB) running qwen3.5:9b via Ollama 0.33.3.
  # Short structured calls (parse_intent, extract_expense) default to 30s.
  # Long-form generation (draft) defaults to 300s.
  short_timeout_seconds: 30
  long_timeout_seconds: 300
  enable_thinking: false
  intent_confidence_threshold: high  # only "high" auto-routes; low/other → human

messaging:
  # Adapters enabled once credentials are provisioned.
  channels:
    whatsapp: false
    sms: false
    email: false
  max_retries: 3

# Section 4.6: Nookal-native SMS + email communication capabilities.
# The clinic uses Nookal as the communication provider.
# All appointment confirmations, reminders, and recalls are delivered natively
# by Nookal PMS automation (configured in Nookal: Manage > Communications).
# The Nookal REST API does not provide an ad-hoc direct SMS/Email dispatch endpoint.
communication:
  nookal_native_sms_configured: true      # Practice has Nookal native SMS configured in Nookal PMS
  nookal_native_email_configured: true    # Practice has Nookal native email configured in Nookal PMS
  nookal_sms_enabled: true                # Backward-compatible alias: Nookal native SMS is active
  nookal_email_enabled: true              # Backward-compatible alias: Nookal native email is active
  app_reminders_enabled: false            # Defer to Nookal native reminders (prevents duplicate sends)

approval:
  store_path: data/working/tasks.jsonl

finance:
  # Client-supplied categories only; keep this list empty until configured.
  categories: []

audit:
  # Reject metadata values longer than this (chars) — free-text dump guard.
  max_metadata_value_length: 200
  forbidden_metadata_keys:
    - patient_name
    - name
    - body
    - content
    - message
    - clinical_notes
    - diagnosis
    - email_body
    - rendered_content
